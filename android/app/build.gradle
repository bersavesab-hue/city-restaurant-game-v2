plugins {
    id 'com.android.application'
}

def testKeystorePath =
    System.getenv(
        "CITY_RESTAURANT_TEST_KEYSTORE"
    )

android {
    namespace 'com.cityrestaurant.game'
    compileSdk 36

    signingConfigs {
        testDebug {
            if (testKeystorePath) {
                storeFile file(testKeystorePath)
                storePassword "android"
                keyAlias "cityrestauranttest"
                keyPassword "android"
            }
        }
    }

    defaultConfig {
        applicationId "com.cityrestaurant.v2playtest"

        minSdk 23
        targetSdk 36

        versionCode 892
        versionName '0.8.92'
    }

    buildTypes {
        debug {
            minifyEnabled false

            if (testKeystorePath) {
                signingConfig signingConfigs.testDebug
            }
        }

        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}

/**
 * V14：不再为了缩包把高清运行图删掉。
 * 只删除设计参考大图与旧压缩运行目录。
 */
def prepareRuntimeAssetsTask = tasks.register('prepareRuntimeAssets') {
    doLast {
        def runtimeRoot = file('src/main/assets/assets')

        delete file("${runtimeRoot}/images/generated")
        delete file("${runtimeRoot}/images/map/city_base_01.webp")
        delete file("${runtimeRoot}/images/runtime")

        println "V14 runtime asset filter applied. Original PNG map, premium images and split PNG sprites retained."
    }
}

tasks.matching { task ->
    task.name == 'preBuild'
}.configureEach {
    dependsOn prepareRuntimeAssetsTask
}
