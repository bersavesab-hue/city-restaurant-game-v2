name: Phase3 365-Day Balance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  longrun:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run 365-day managed business baseline
        run: npm run test:phase3:longrun
