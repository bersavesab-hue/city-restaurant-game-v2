name: CI

on:
  push:
    branches:
      - "**"
    paths:
      - "src/**"
      - "client/**"
      - "mobile/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "AGENTS.md"
      - "docs/**"
      - "assets/manifest.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/mobile-ui-playtest.yml"
  pull_request:
    paths:
      - "src/**"
      - "client/**"
      - "mobile/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "AGENTS.md"
      - "docs/**"
      - "assets/manifest.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/mobile-ui-playtest.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run focused project gate
        run: npm run test:ci
