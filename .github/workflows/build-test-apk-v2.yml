name: Build Test APK V2

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build Android web bundle
        run: npm run build:android-js

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Locate and prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$ANDROID_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_ROOT"
            find "$ANDROID_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_ROOT" "platforms;android-34" "build-tools;34.0.0"
          ls -la "$ANDROID_ROOT/platforms/android-34/android.jar"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon clean assembleDebug --stacktrace

      - name: Verify and rename APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" city-restaurant-v2-test-0.8.66.apk
          ls -lh city-restaurant-v2-test-0.8.66.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: city-restaurant-v2-test-0.8.66
          path: city-restaurant-v2-test-0.8.66.apk
          if-no-files-found: error
          retention-days: 7
