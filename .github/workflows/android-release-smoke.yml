name: Android Release Smoke

concurrency:
  group: android-release-smoke-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run phase8 release gate
        run: npm run test:phase8:release

      - name: Run pre-release playtest acceptance gate
        run: npm run test:release:acceptance

      - name: Build Android web bundle
        run: npm run build:android-js

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Locate Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$ANDROID_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Prepare stable test signing
        shell: bash
        run: |
          set -euo pipefail
          SIGNING_DIR="$RUNNER_TEMP/city-restaurant-signing"
          mkdir -p "$SIGNING_DIR"
          base64 --decode .github/test-signing/debug.keystore.b64 > "$SIGNING_DIR/debug.keystore"
          keytool -list -keystore "$SIGNING_DIR/debug.keystore" -storepass android -alias cityrestauranttest >/dev/null
          echo "CITY_RESTAURANT_TEST_KEYSTORE=$SIGNING_DIR/debug.keystore" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon clean assembleDebug --stacktrace

      - name: Prepare playtest package
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          VERSION="$(node -p "require('./package.json').version")"
          APK_NAME="city-restaurant-v${VERSION}-playtest.apk"
          cp "$APK" "$APK_NAME"
          sha256sum "$APK_NAME" > SHA256SUMS.txt
          node scripts/generate-release-metadata.mjs "$APK_NAME" release-metadata.json
          echo "APK_ARTIFACT_NAME=$APK_NAME" >> "$GITHUB_ENV"
          ls -lh "$APK_NAME" release-metadata.json SHA256SUMS.txt

      - name: Upload playtest smoke package
        uses: actions/upload-artifact@v4
        with:
          name: city-restaurant-android-smoke
          path: |
            ${{ env.APK_ARTIFACT_NAME }}
            release-metadata.json
            SHA256SUMS.txt
            PRIVACY.md
            docs/PUBLISHING.md
            docs/STORE_LISTING_DRAFT.md
            docs/PLAYTEST_ACCEPTANCE.md
          if-no-files-found: error
          retention-days: 30
