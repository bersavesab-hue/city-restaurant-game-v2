name: Mobile UI Playtest

on:
  workflow_dispatch:
  push:
    branches:
      - "ai/baseline-freeze-20260929"
    tags:
      - "playtest-*"

permissions:
  contents: read

concurrency:
  group: mobile-playtest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run focused CI gate
        run: npm run test:ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p mobile/android :app:assembleDebug --stacktrace

      - name: Generate release metadata
        env:
          PLAYTEST_SIGNING_MODE: android-debug
          PLAYTEST_SIGNING_STABLE: "false"
        run: |
          node scripts/generate-release-metadata.mjs \
            mobile/android/app/build/outputs/apk/debug/app-debug.apk \
            release-metadata.json

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-playtest-${{ github.sha }}
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            release-metadata.json
          if-no-files-found: error

      - name: Upload browser UI
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-mobile-ui-web-${{ github.sha }}
          path: dist/mobile-ui
          if-no-files-found: error
