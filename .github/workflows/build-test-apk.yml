name: Build Test APK

on:
  push:
    branches:
      - main
      - apk-test-build
      - apk-test-build-2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build Android web bundle
        run: npm run build:android-js

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Locate Android SDK tools
        shell: bash
        run: |
          ANDROID_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$ANDROID_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Using sdkmanager: $SDKMANAGER"

      - name: Accept Android SDK licenses
        run: yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Install Android SDK 34
        run: "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Prepare APK artifact
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk city-restaurant-v2-test.apk
          ls -lh city-restaurant-v2-test.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: city-restaurant-v2-test-apk
          path: city-restaurant-v2-test.apk
          if-no-files-found: error
          retention-days: 7
