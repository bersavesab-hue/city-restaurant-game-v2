name: Restaurant V2 Playtest APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

    paths:
      - "src/**"
      - "assets/**"
      - "android/**"
      - "scripts/build-android-js-v2.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-v2-playtest.yml"

jobs:
  build:
    runs-on:
      ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: npm install

      - name: Run V2 foundation smoke tests
        run: node --test tests/foundation-v2-smoke.test.js tests/business-causality.test.js

      - name: Build V2 game bundle
        run: npm run build:android-js

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK 34
        run: |
          sdkmanager_path="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$sdkmanager_path" ]; then
            sdkmanager_path="$(command -v sdkmanager)"
          fi

          "$sdkmanager_path" "platforms;android-34"
          "$sdkmanager_path" "build-tools;34.0.0"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: city-restaurant-v2-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
