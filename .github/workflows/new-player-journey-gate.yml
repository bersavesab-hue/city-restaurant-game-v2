name: New Player Journey Gate

concurrency:
  group: new-player-journey-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

  push:
    branches:
      - main

    paths:
      - "src/systems/OnboardingSystem.js"
      - "src/systems/OpeningFlowSystem.js"
      - "src/systems/RestaurantSystem.js"
      - "src/systems/OperatingCycleSystem.js"
      - "src/systems/OperatingScheduleSystem.js"
      - "src/ui/runtime/AndroidPlaytestEntry.js"
      - "tests/new-player-full-journey-e2e.test.js"
      - "tests/pre-release-playtest-acceptance.test.js"
      - "scripts/pre-release-playtest-gate.mjs"
      - ".github/workflows/new-player-journey-gate.yml"

permissions:
  contents: read

jobs:
  journey:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run full new-player journey
        run: node --test tests/new-player-full-journey-e2e.test.js

      - name: Run pre-release playtest acceptance
        run: npm run test:release:acceptance
