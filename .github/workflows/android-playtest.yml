name: Restaurant Playtest APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

    paths:
      - "src/**"
      - "assets/**"
      - "android/**"
      - "scripts/build-android-js.mjs"
      - "scripts/phase2-gate.mjs"
      - "scripts/phase3-balance-gate.mjs"
      - "scripts/phase3-longrun-gate.mjs"
      - "scripts/phase3-performance-gate.mjs"
      - "scripts/save-compatibility-gate.mjs"
      - "scripts/chain-expansion-gate.mjs"
      - "scripts/phase6-lifecycle-gate.mjs"
      - "scripts/stress-20year.mjs"
      - "scripts/aging-performance.mjs"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/test-signing/**"
      - ".github/workflows/android-playtest.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run playable-flow gate
        run: npm run test:phase2

      - name: Run save compatibility gate
        run: npm run test:save-compat

      - name: Run chain expansion gate
        run: npm run test:phase5:chain

      - name: Run phase6 lifecycle gate
        run: npm run test:phase6:lifecycle

      - name: Run phase3 performance gate
        run: npm run test:phase3:performance

      - name: Run phase3 90-day balance gate
        run: npm run test:phase3:balance

      - name: Run phase3 365-day longrun gate
        run: npm run test:phase3:longrun

      - name: Build Android web bundle
        run: npm run build:android-js

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Locate Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$ANDROID_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Prepare stable test signing
        shell: bash
        run: |
          set -euo pipefail
          SIGNING_DIR="$RUNNER_TEMP/city-restaurant-signing"
          mkdir -p "$SIGNING_DIR"
          base64 --decode .github/test-signing/debug.keystore.b64 > "$SIGNING_DIR/debug.keystore"
          keytool -list -keystore "$SIGNING_DIR/debug.keystore" -storepass android -alias cityrestauranttest >/dev/null
          echo "CITY_RESTAURANT_TEST_KEYSTORE=$SIGNING_DIR/debug.keystore" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon clean assembleDebug --stacktrace

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" city-restaurant-test.apk
          ls -lh city-restaurant-test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: city-restaurant-test-apk
          path: city-restaurant-test.apk
          if-no-files-found: error
          retention-days: 30
