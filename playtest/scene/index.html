<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
  >
  <title>餐厅场景原型</title>
  <link rel="stylesheet" href="scene.css">
</head>
<body>
  <main class="playtest">
    <header class="playtest__hud">
      <div>
        <strong>餐厅场景原型</strong>
        <small id="money">营业收入 ¥0</small>
      </div>
      <button id="toggle" type="button">暂停</button>
    </header>

    <section class="playtest__stage">
      <canvas id="scene"></canvas>
    </section>

    <section class="playtest__info">
      <strong id="stats">正在启动场景……</strong>
      <span id="state">等待人物进入</span>
    </section>

    <footer class="playtest__controls">
      <button type="button" data-speed="1" class="is-active">1×</button>
      <button type="button" data-speed="2">2×</button>
      <button type="button" data-speed="4">4×</button>
      <button id="spawn" type="button">+ 顾客</button>
    </footer>
  </main>
  <script src="scene.js"></script>
</body>
</html>
